<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="horizon">
      <rect width="512" height="336" />
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0e0f11" />
  <!-- Yesterday's sun, dashed like past days in the charts, half set -->
  <circle
    cx="160"
    cy="340"
    r="76"
    fill="none"
    stroke="#6e737b"
    stroke-width="20"
    stroke-dasharray="28 20"
    clip-path="url(#horizon)"
  />
  <!-- Today's sun -->
  <circle cx="330" cy="206" r="84" fill="#f2c94c" />
  <!-- One slow swell, in the forecast teal -->
  <path
    d="M64 356 q 96 -24 192 0 t 192 0"
    fill="none"
    stroke="#3cc4b4"
    stroke-width="22"
    stroke-linecap="round"
  />
</svg>
